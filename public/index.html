<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saltygram</title><link rel="stylesheet" href="/style.css"></head><body class="home-open">
<div class="shell">
<aside>
 <header><h1><span id="statusDot" class="status-dot"></span>Saltygram<span id="count" hidden></span></h1><div class="header-actions"><button id="theme" class="icon" title="切换主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13a8 8 0 0 1-9-9 8 8 0 1 0 9 9Z"/></svg></button><button id="searchButton" class="icon" title="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button><button id="menuButton" class="icon" title="菜单" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div><div id="menuPanel" hidden role="menu"></div></header>
 <div class="search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" placeholder="搜索" aria-label="搜索聊天"><button id="searchClose" class="icon" title="关闭搜索" aria-label="关闭搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
 <div class="tabs"><button class="selected" data-tab="all">全部</button><button data-tab="unread">未读 <i id="unread"></i></button><button data-tab="private">私聊</button><button data-tab="group">群组</button></div>
 <div id="dialogLoading" role="status" hidden>正在加载会话…</div><div id="dialogs"></div><div id="contactsView" class="nav-view"></div><div id="meView" class="nav-view"></div>
</aside>
<main>
 <section id="emptyState" aria-labelledby="startTitle"><div class="start-content"><svg class="start-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="m7 22 34-14-12 33-7-13-15-6Z"/><path d="m22 28 19-20"/></svg><p class="start-eyebrow">SALTYGRAM</p><h2 id="startTitle">从这里，开始聊。</h2><p id="startDescription">连接你的账号，让对话触手可及。</p><button id="emptyConnect">连接 Telegram <span aria-hidden="true">↗</span></button><p class="start-note">轻一点，专注每一次对话。</p></div></section>
 <div class="chat-header"><button id="back" class="icon" title="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><div id="chatAvatar" class="avatar"></div><div class="chat-title"><h2 id="chatTitle"></h2><p id="chatStatus"></p></div><button id="chatSearch" class="icon" title="搜索聊天"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button><button id="mediaPanelButton" class="icon" title="媒体与文件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1"/><path d="m4 16 5-4 4 3 3-3 4 4"/></svg></button><button id="details" class="icon" title="会话菜单" aria-label="会话菜单" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button></div>
 <div id="topicsWrap" hidden><select id="topicSelect" aria-label="选择群话题"><option value="0">全部消息</option></select><button id="moreTopics" hidden>更多话题</button></div><div class="conversation"><div class="history-controls"><button id="loadOlder">加载更早消息</button><button id="returnLatest" hidden>回到最新</button></div><div id="messages"></div></div>
 <div class="composer-wrap"><div id="composeContext" hidden><div><strong id="composeContextLabel"></strong><span id="composeContextText"></span></div><button id="cancelCompose" aria-label="取消回复或编辑">×</button></div><form id="composer"><button type="button" id="emoji" class="icon" title="插入表情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8 14s1 3 4 3 4-3 4-3M8 9h1M15 9h1"/></svg></button><button type="button" id="myStickers" class="icon" title="我的贴纸"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 4h14v10l-5 6H5zM14 20v-6h5"/></svg></button><textarea id="message" rows="1" placeholder="消息" aria-label="消息内容"></textarea><button class="send icon" title="发送消息"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 11 16-7-7 16-2-7-7-2Z"/><path d="m11 13 9-9"/></svg></button></form></div>
</main></div>
<dialog id="login"><form id="authForm"><button type="button" id="closeLogin" class="close icon" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button><h2>连接 Telegram</h2><div id="credentials"><label for="apiId">API ID</label><input id="apiId" inputmode="numeric" autocomplete="off" required><label for="apiHash">API Hash</label><input id="apiHash" type="password" autocomplete="off" required><div class="credential-actions"><button id="testConnection" type="button" class="text-button">测试连接</button><button id="clearLocal" type="button" class="text-button">清除本地数据</button></div><label class="remember"><input id="remember" type="checkbox" checked> 记住此设备</label></div><p id="authHint">输入手机号获取验证码。</p><label id="authLabel" for="authInput">手机号码</label><input id="authInput" placeholder="+86" autocomplete="tel" required><div id="authError" role="alert"></div><button id="authSubmit" class="primary">获取验证码</button><button type="button" id="qrLoginButton" class="text-button">改用扫码登录</button><div id="qrLogin" hidden><div id="qrBox"><img id="qrImage" alt="" hidden><div id="qrLoading">正在生成二维码…</div></div><p id="qrExpire"></p><p id="qrHint">请在已登录的 Telegram 设备上：设置 → 设备 → 链接设备 → 扫描此二维码。</p><button type="button" id="cancelQrLogin" class="text-button">返回验证码登录</button></div><small>凭据与会话仅保存在此浏览器。</small></form></dialog>
<dialog id="mediaLibrary"><button id="closeMediaLibrary" class="close icon" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button><h2>媒体与文件</h2><p>当前已加载的消息</p><div id="mediaList"></div></dialog>
<dialog id="mediaViewer"><button id="closeViewer" class="close icon" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button><div id="viewerContent"></div></dialog><dialog id="storageDialog"><button id="closeStorage" class="close icon" aria-label="关闭">×</button><h2>本地缓存</h2><div class="watch-haptics-settings"><label class="remember"><input id="watchHapticsEnabled" type="checkbox" checked> 表圈滚动震动</label><button id="testWatchHaptics" class="media-action">测试震动</button></div><p id="cacheUsage"></p><p id="cacheQuota"></p><p id="cachePersistence"></p><button id="persistCache" class="media-action">保护持久缓存</button><button id="clearCache" class="media-action">清理缓存</button><small>清理图片、头像与消息副本，保留登录。缓存默认上限 512 MiB，超出后自动淘汰最久未使用的内容。</small></dialog><dialog id="stickerPack"><button id="closeStickerPack" class="close icon" aria-label="关闭">×</button><h2 id="stickerTitle">贴纸包</h2><div id="stickerPackActions"><button id="installStickerPack" class="media-action">添加到我的贴纸</button><button id="useStickerPack" class="media-action">用于当前聊天</button></div><div id="stickerGrid"></div><a id="stickerPackLink" target="_blank" rel="noopener noreferrer"></a></dialog><dialog id="myStickersDialog"><button id="closeMyStickers" class="close icon" aria-label="关闭">×</button><h2>我的贴纸</h2><div id="myStickerSets"></div><button id="refreshMyStickers" class="media-action">刷新</button></dialog><dialog id="deleteDialog"><h2>删除消息</h2><p id="deletePreview"></p><label id="deleteRevokeWrap" class="remember"><input id="deleteRevoke" type="checkbox"> 同时为对方删除</label><p id="deleteHelp"></p><p id="deleteError" role="alert"></p><div class="delete-actions"><button id="cancelDelete">取消</button><button id="confirmDelete">删除</button></div></dialog><div id="messageMenu" hidden role="menu"></div><div id="conversationMenu" role="menu" hidden></div><dialog id="contactDialog"><form id="contactForm"><button id="closeContact" class="close icon" type="button" aria-label="关闭">×</button><h2 id="contactTitle">添加联系人</h2><label for="contactFirstName">名字</label><input id="contactFirstName" maxlength="64" required autocomplete="off"><label for="contactLastName">姓氏（可选）</label><input id="contactLastName" maxlength="64" autocomplete="off"><p id="contactError" role="alert"></p><button id="saveContact" class="primary">保存联系人</button><small>保存到 Telegram 联系人。不额外向对方分享你的手机号。</small></form></dialog><dialog id="conversationActionDialog"><h2 id="conversationActionTitle"></h2><p id="conversationActionDescription"></p><label id="conversationRevokeWrap" class="remember" hidden><input id="conversationRevoke" type="checkbox"> 同时为对方删除</label><p id="conversationActionError" role="alert"></p><div class="delete-actions"><button id="cancelConversationAction">取消</button><button id="confirmConversationAction" class="danger-button">确认</button></div></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
